<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cinnabar palette gallery</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--foreground, CanvasText);
        font: 15px/1.45 var(--font-sans, system-ui, sans-serif);
      }
      main {
        display: grid;
        gap: 18px;
        max-width: 1080px;
        margin-inline: auto;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: clamp(26px, 5vw, 38px);
        line-height: 1.1;
        letter-spacing: -0.055em;
      }
      header p {
        margin-top: 7px;
      }
      button,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--ring, Highlight);
        outline-offset: 3px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
      }
      .segments {
        display: inline-flex;
        flex-wrap: wrap;
        padding: 3px;
        gap: 2px;
        border: 1px solid var(--border, GrayText);
        border-radius: 12px;
      }
      .segments button {
        border: 0;
        padding: 7px 11px;
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font-weight: 550;
        font-size: 13px;
      }
      .segments button[aria-pressed="true"] {
        background: var(--secondary, ButtonFace);
        color: var(--secondary-foreground, ButtonText);
      }
      .comparison {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        align-items: start;
      }
      .column {
        min-width: 0;
      }
      .picker {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 7px;
        font-size: 12px;
        font-weight: 650;
      }
      select {
        width: 100%;
        min-width: 0;
        color: inherit;
        background: var(--card, Canvas);
        border: 1px solid var(--border, GrayText);
        border-radius: 9px;
        padding: 8px;
      }
      .screen {
        display: flex;
        flex-direction: column;
        gap: 13px;
        padding: clamp(10px, 2.7vw, 22px);
        min-height: 378px;
        border-radius: 18px;
        background: var(--canvas);
        color: var(--text-primary);
        border: 1px solid var(--hairline);
        font-variant-numeric: tabular-nums;
      }
      .screen h2 {
        font-size: clamp(20px, 3.8vw, 30px);
        line-height: 1.1;
        letter-spacing: -0.045em;
        margin-top: 3px;
      }
      .screen h3 {
        font-size: 15px;
        line-height: 1.25;
      }
      .screen small {
        color: var(--text-muted);
        font-size: 11px;
      }
      .screen .lead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 5px;
      }
      .timer {
        padding: 5px 8px;
        border-radius: 9px;
        background: var(--identity-soft);
        color: var(--text-primary);
        font-weight: 700;
        white-space: nowrap;
      }
      .timer small {
        display: block;
        color: inherit;
      }
      .block {
        background: var(--surface);
        border-radius: 12px;
        padding: 12px;
      }
      .exercise {
        display: grid;
        gap: 5px;
      }
      .set {
        display: grid;
        grid-template-columns: 1fr 1fr 0.75fr 26px;
        gap: 4px;
        align-items: center;
        text-align: center;
        padding: 4px;
        min-height: 31px;
        border-radius: 7px;
      }
      .set:first-child {
        padding-top: 0;
      }
      .set > :first-child {
        text-align: left;
        padding-left: 4px;
      }
      .set.done {
        background: var(--set-done-soft);
      }
      .set.current {
        background: var(--surface-control);
        outline: 1px solid var(--identity);
      }
      .mark {
        display: grid;
        place-items: center;
        justify-self: center;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        color: var(--text-muted);
        font-size: 11px;
        line-height: 1;
      }
      .done .mark {
        background: var(--set-done);
        color: var(--on-set-done);
      }
      .primary {
        width: 100%;
        margin-top: auto;
        border: 0;
        border-radius: 11px;
        background: var(--action);
        color: var(--on-action);
        min-height: 39px;
        padding: 7px 5px;
        font-weight: 700;
      }
      .primary:hover {
        background: var(--action-hover);
      }
      .primary:active {
        background: var(--action-pressed);
      }
      .primary:focus-visible {
        outline-color: var(--focus-ring);
      }
      .primary:disabled {
        opacity: 1;
        cursor: default;
      }
      .note {
        color: var(--danger);
        font-size: 11px;
      }
      .big {
        display: block;
        font-size: 36px;
        letter-spacing: -0.07em;
        line-height: 1.1;
      }
      .chart {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        align-items: end;
        height: 107px;
        gap: 7px;
        margin-top: 8px;
      }
      .bar {
        display: grid;
        align-content: end;
        justify-items: center;
        height: 100%;
        gap: 3px;
      }
      .bar i {
        display: block;
        height: var(--bar-height);
        width: 76%;
        border-radius: 4px 4px 0 0;
        background: var(--chart);
      }
      .bar small {
        text-align: center;
      }
      .change {
        color: var(--success-text);
        font-size: 12px;
        font-weight: 650;
      }
      .info {
        display: grid;
        gap: 6px;
        align-content: start;
        margin-top: 7px;
        font-size: 12px;
      }
      .strip {
        display: flex;
        height: 10px;
        border: 1px solid var(--border, GrayText);
        border-radius: 8px;
        overflow: hidden;
      }
      .strip i {
        flex: 1;
      }
      details summary {
        cursor: pointer;
      }
      dl {
        margin: 6px 0 0;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 3px 8px;
      }
      dd {
        margin: 0;
        font-family: var(--font-mono, monospace);
      }
      .palette-bank h2 {
        font-size: 18px;
      }
      .palette-bank p {
        font-size: 13px;
        margin: 3px 0 8px;
      }
      .choices {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(106px, 1fr));
        gap: 6px;
      }
      .choices button {
        background: transparent;
        color: inherit;
        text-align: left;
        border: 1px solid var(--border, GrayText);
        border-radius: 9px;
        padding: 6px;
        font-size: 12px;
      }
      .choices button[aria-pressed="true"] {
        border-color: var(--foreground, CanvasText);
        font-weight: 700;
      }
      .choices .strip {
        margin-bottom: 4px;
        height: 9px;
      }
      @media (max-width: 430px) {
        .comparison {
          gap: 6px;
        }
        .screen {
          padding: 8px;
          gap: 8px;
          min-height: 353px;
        }
        .block {
          padding: 7px;
        }
        .timer {
          font-size: 12px;
        }
        .set {
          font-size: 13px;
        }
        .chart {
          gap: 2px;
        }
        .bar small {
          font-size: 9px;
        }
      }
      @media (max-width: 320px) {
        .comparison {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Cinnabar palette gallery</h1>
        <p>16 candidates on the same workout screens. Pick two to compare.</p>
      </header>
      <div class="toolbar">
        <div class="segments" aria-label="Appearance" role="group">
          <button type="button" data-mode="light" aria-pressed="false">Light</button>
          <button type="button" data-mode="dark" aria-pressed="true">Dark</button>
          <button type="button" data-mode="black" aria-pressed="false">True black</button>
        </div>
        <div class="segments" aria-label="Screen" role="group">
          <button type="button" data-scene="training" aria-pressed="true">Training</button>
          <button type="button" data-scene="progress" aria-pressed="false">Progress</button>
        </div>
      </div>
      <div class="comparison">
        <section class="column" aria-label="Palette A">
          <label class="picker"
            >A
            <select id="palette-a" aria-label="Palette A"></select
          ></label>
          <div class="screen" id="screen-a"></div>
          <div class="info" id="info-a"></div>
        </section>
        <section class="column" aria-label="Palette B">
          <label class="picker"
            >B
            <select id="palette-b" aria-label="Palette B"></select
          ></label>
          <div class="screen" id="screen-b"></div>
          <div class="info" id="info-b"></div>
        </section>
      </div>
      <section class="palette-bank" aria-labelledby="bank-title">
        <h2 id="bank-title">All palettes</h2>
        <p>Select a swatch to load it into B.</p>
        <div class="choices" id="choices"></div>
      </section>
    </main>

    <script>
      const palettes = JSON.parse(document.querySelector("#palettes").textContent);
      const picks = { a: "Ink", b: "Juniper" };
      const logged = { a: false, b: false };
      let mode = "dark";
      let scene = "training";
      const choices = document.querySelector("#choices");

      const coreRoles = [
        ["canvas", "Canvas"],
        ["surface", "Surface"],
        ["surface-control", "Control"],
        ["text-primary", "Ink"],
        ["action", "Action"],
        ["on-action", "Action label"],
      ];

      function strip(roles) {
        return (
          '<div class="strip" aria-hidden="true">' +
          coreRoles.map(([role]) => '<i style="background:' + roles[role] + '"></i>').join("") +
          "</div>"
        );
      }

      function training(done) {
        return `
      <div class="lead">
        <div><small>Training · Upper body</small><h2>Upper A</h2></div>
        <div class="timer"><small>Rest</small>1:24</div>
      </div>
      <div class="block exercise">
        <h3>Barbell bench press</h3>
        <small>3 working sets · 6–8 reps</small>
        <div class="set"><small>Set</small><small>kg</small><small>Reps</small><small>Log</small></div>
        <div class="set done"><span>1</span><strong>70</strong><strong>8</strong><span class="mark" aria-label="Completed">✓</span></div>
        <div class="set done"><span>2</span><strong>72.5</strong><strong>8</strong><span class="mark" aria-label="Completed">✓</span></div>
        <div class="set ${done ? "done" : "current"}"><span>3</span><strong>75</strong><strong>6</strong><span class="mark" aria-label="${done ? "Completed" : "Current set"}">${done ? "✓" : "●"}</span></div>
      </div>
      <div class="block"><h3>Chest-supported row</h3><small>Up next · 3 sets</small></div>
      <button type="button" class="primary" ${done ? "disabled" : ""}>${done ? "✓ Set logged" : "Log set"}</button>`;
      }

      function progress() {
        const marks = [68, 74, 81, 78, 86, 92];
        return `
      <div><small>Past six weeks</small><h2>Progress</h2></div>
      <div class="block">
        <h3>Bench press · est. 1RM</h3>
        <strong class="big">92 <small>kg</small></strong>
        <span class="change">↑ 24 kg in six weeks</span>
        <div class="chart" role="img" aria-label="Estimated one rep max by week, 68, 74, 81, 78, 86 and 92 kilograms">
          ${marks.map((value, i) => `<div class="bar" style="--bar-height:${value * 0.77}px"><i></i><small>W${i + 1}</small></div>`).join("")}
        </div>
      </div>
      <div class="block"><h3>Training volume</h3><small>12,420 kg lifted this week</small></div>
      <span class="note">One workout is missing a load.</span>`;
      }

      function renderPanel(slot) {
        const palette = palettes.find(({ name }) => name === picks[slot]);
        const roles = palette.modes[mode];
        const panel = document.querySelector("#screen-" + slot);
        panel.style.cssText = Object.entries(roles)
          .map(([role, color]) => "--" + role + ":" + color)
          .join(";");
        panel.style.colorScheme = mode === "light" ? "light" : "dark";
        panel.innerHTML = scene === "training" ? training(logged[slot]) : progress();
        panel.querySelector(".primary")?.addEventListener("click", () => {
          logged[slot] = true;
          renderPanel(slot);
        });
        const info = document.querySelector("#info-" + slot);
        const wasOpen = info.querySelector("details")?.open;
        info.innerHTML =
          strip(roles) +
          "<span>" +
          palette.description +
          "</span>" +
          "<details><summary>Hex values and contrast</summary><dl>" +
          coreRoles
            .map(([role, label]) => "<dt>" + label + "</dt><dd>" + roles[role] + "</dd>")
            .join("") +
          "<dt>Primary ink on surface</dt><dd>" +
          palette.ratios[mode].text +
          ":1</dd>" +
          "<dt>Button label on fill</dt><dd>" +
          palette.ratios[mode].button +
          ":1</dd>" +
          "<dt>Chart on surface</dt><dd>" +
          palette.ratios[mode].chart +
          ":1</dd></dl></details>";
        info.querySelector("details").open = Boolean(wasOpen);
      }

      function render() {
        for (const slot of ["a", "b"]) {
          document.querySelector("#palette-" + slot).value = picks[slot];
          renderPanel(slot);
        }
        for (const button of choices.children) {
          const palette = palettes.find(({ name }) => name === button.value);
          button.innerHTML = strip(palette.modes[mode]) + palette.name;
          button.setAttribute("aria-pressed", String(button.value === picks.b));
        }
        document.querySelectorAll("[data-mode], [data-scene]").forEach((button) => {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.mode === mode || button.dataset.scene === scene),
          );
        });
      }

      for (const palette of palettes) {
        for (const slot of ["a", "b"]) {
          document.querySelector("#palette-" + slot).add(new Option(palette.name, palette.name));
        }
        const button = document.createElement("button");
        button.type = "button";
        button.value = palette.name;
        button.addEventListener("click", () => {
          picks.b = palette.name;
          logged.b = false;
          render();
        });
        choices.append(button);
      }
      for (const slot of ["a", "b"]) {
        document.querySelector("#palette-" + slot).addEventListener("change", (event) => {
          picks[slot] = event.target.value;
          logged[slot] = false;
          render();
        });
      }
      document.querySelectorAll("[data-mode]").forEach((button) =>
        button.addEventListener("click", () => {
          mode = button.dataset.mode;
          render();
        }),
      );
      document.querySelectorAll("[data-scene]").forEach((button) =>
        button.addEventListener("click", () => {
          scene = button.dataset.scene;
          render();
        }),
      );
      render();
    </script>
