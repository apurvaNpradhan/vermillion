# Dev-only services. Apps run on the host; this provides Postgres and the sync stack.
# DATABASE_URL=postgresql://postgres:password@localhost:5432/vermillion
#
# `pnpm db:start` builds the bootstrap bundle, then starts everything:
#   postgres -> powersync-bootstrap (one shot) -> powersync
#   minio -> minio-init (one shot: the private user-media bucket, ADR 0040)
# Passwords below are development defaults; override them in a root .env if you like.
name: vermillion

services:
  postgres:
    image: postgres:18
    container_name: vermillion-postgres
    # Logical decoding for PowerSync. The slot cap stops a stopped PowerSync
    # service from filling the disk with retained WAL (ADR 0025). 4GB is a
    # development setting, not a production sizing.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_slot_wal_keep_size=4GB
      # Each parallel test file holds its own pools on a cloned database.
      - -c
      - max_connections=200
    environment:
      POSTGRES_DB: vermillion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vermillion_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vermillion"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One shot: roles, storage database, grants and the empty publication (ADR 0023).
  # Runs the bundle `tsdown` emits next to the server (`pnpm --filter server build:bootstrap`); rerunning is safe.
  powersync-bootstrap:
    image: node:24-slim
    command: ["node", "/app/sync-bootstrap.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-vermillion}
      POWERSYNC_REPLICATION_PASSWORD: ${POWERSYNC_REPLICATION_PASSWORD:-powersync_local_replication}
      POWERSYNC_STORAGE_PASSWORD: ${POWERSYNC_STORAGE_PASSWORD:-powersync_local_storage}
    volumes:
      - ./apps/server/dist:/app:ro
    restart: "no"

  powersync:
    # Pinned by tag and digest (the multi-arch index of 1.28.1). Upgrades are deliberate.
    image: journeyapps/powersync-service:1.28.1@sha256:4955ebd8218d076f23296750f658c2973ce1dcd2ba49a6c7a7c3320acf97325c
    command: ["start", "-r", "unified"]
    depends_on:
      postgres:
        condition: service_healthy
      powersync-bootstrap:
        condition: service_completed_successfully
    # Reaches the API's JWKS endpoint on the host without network_mode: host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_PORT: "8080"
      PS_SSLMODE: ${PS_SSLMODE:-disable}
      PS_DATA_SOURCE_URI: postgresql://powersync_replication:${POWERSYNC_REPLICATION_PASSWORD:-powersync_local_replication}@postgres:5432/${POSTGRES_DB:-vermillion}
      PS_STORAGE_SOURCE_URI: postgresql://powersync_storage:${POWERSYNC_STORAGE_PASSWORD:-powersync_local_storage}@postgres:5432/powersync_storage
      PS_JWKS_URI: http://host.docker.internal:3000/api/auth/jwks
      PS_ADMIN_TOKEN: ${PS_ADMIN_TOKEN:-vermillion_local_admin_token}
    volumes:
      - ./powersync/service.yaml:/config/service.yaml:ro
      - ./powersync/sync-config.yaml:/config/sync-config.yaml:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/probes/readiness').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  # S3-compatible stand-in for the private R2 bucket of user media (ADR 0040). It checks
  # presigned signatures the way R2 does. The community minio/minio images are no longer
  # published, so this pins the last Bitnami build (MinIO 2025-07-23, final) by tag and digest
  # (the multi-arch index). Development and CI only; staging and production use R2.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    container_name: vermillion-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vermillion}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vermillion-local-secret}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - vermillion_minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  # One shot: creates the dev bucket. No bucket policy and no CORS rules are set, so nothing is
  # publicly readable and browsers cannot call it; the app only uses presigned URLs. Rerunning is safe.
  minio-init:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/${MEDIA_S3_BUCKET:-vermillion-user-media}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vermillion}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vermillion-local-secret}
    restart: "no"

volumes:
  vermillion_postgres_data:
  vermillion_minio_data:
