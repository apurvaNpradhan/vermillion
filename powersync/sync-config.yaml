# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
# Streams list columns explicitly, never `*` (ADR 0019). A stream may only be
# deployed after its table is in the `powersync` publication (the table's migration
# runs `ALTER PUBLICATION`), otherwise replication fails (ADR 0023). The parity
# test checks every stream's columns against the migrated table.
config:
  edition: 3

streams:
  # The exercise catalog (Reference data, ADR 0034): the same rows for every user, so the service
  # stores them once. Retired rows stay so logged history resolves. Lower priority than the
  # user's own library so personal data is usable first. `updated_at` stays on the server.
  exercise_catalog:
    auto_subscribe: true
    priority: 3
    query: SELECT id, user_id, title, primary_muscle, secondary_muscles, equipment, exercise_type, is_full_bodyweight, rank, search_terms, aka, instructions, video_key, thumbnail_key, retired_at, created_at FROM exercise WHERE user_id IS NULL

  # A user's Custom exercises, archived ones included.
  my_library:
    auto_subscribe: true
    priority: 1
    query: SELECT id, user_id, title, primary_muscle, secondary_muscles, equipment, exercise_type, is_full_bodyweight, rank, search_terms, aka, instructions, video_key, thumbnail_key, retired_at, created_at FROM exercise WHERE user_id = auth.user_id()
