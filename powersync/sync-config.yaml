# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
# Streams list columns explicitly, never `*` (ADR 0019). A stream may only be
# deployed after its table is in the `powersync` publication (the table's migration
# runs `ALTER PUBLICATION`), otherwise replication fails (ADR 0023). The parity
# test checks every stream's columns against the migrated table.
config:
  edition: 3

streams:
  # The exercise catalog (Reference data, ADR 0034): the same rows for every user, so the service
  # stores them once. Retired rows stay so logged history resolves. Lower priority than the
  # user's own library so personal data is usable first. `updated_at` stays on the server.
  exercise_catalog:
    auto_subscribe: true
    priority: 3
    query: SELECT id, user_id, title, primary_muscle, secondary_muscles, primary_detail, secondary_detail, equipment, exercise_type, is_full_bodyweight, rank, search_terms, aka, instructions, video_key, thumbnail_key, image_media_id, retired_at, created_at FROM exercise WHERE user_id IS NULL

  # A user's Custom exercises, archived ones included.
  my_library:
    auto_subscribe: true
    priority: 1
    query: SELECT id, user_id, title, primary_muscle, secondary_muscles, primary_detail, secondary_detail, equipment, exercise_type, is_full_bodyweight, rank, search_terms, aka, instructions, video_key, thumbnail_key, image_media_id, retired_at, created_at FROM exercise WHERE user_id = auth.user_id()

  # A user's training (ADR 0036, 0038): one subscription over the four plan tables, so a Workout,
  # its exercises and the Rotation arrive together, and the session tables (a Session, its
  # exercises and Logged sets, the gym equipment and the per-exercise settings). Soft-deleted rows
  # leave the stream. `updated_at` and `deleted_at` stay on the server.
  my_training:
    auto_subscribe: true
    priority: 1
    queries:
      - SELECT id, user_id, program_id, activated_at, started_at, finished_at, outcome, continued_at, created_at FROM program_run WHERE user_id = auth.user_id() AND deleted_at IS NULL
      - SELECT id, user_id, title, description, planned_weeks, sessions_per_week, cover_media_id, created_at FROM program WHERE user_id = auth.user_id() AND deleted_at IS NULL
      - SELECT id, user_id, program_id, title, note, created_at FROM workout WHERE user_id = auth.user_id() AND deleted_at IS NULL
      - SELECT id, user_id, workout_id, exercise_id, position, rest_seconds, note, superset_group, sets, created_at FROM workout_exercise WHERE user_id = auth.user_id() AND deleted_at IS NULL
      - SELECT id, user_id, program_id, workout_id, position, created_at FROM program_slot WHERE user_id = auth.user_id() AND deleted_at IS NULL
      - SELECT id, user_id, workout_id, program_id, run_id, slot_id, cycle, title, title_derived, note, started_at, finished_at, duration_s, device_id, rest_set_id, rest_started_at, rest_ends_at, created_at, workout_structure FROM training_session WHERE user_id = auth.user_id() AND deleted_at IS NULL
      - SELECT id, user_id, session_id, exercise_id, exercise_title, exercise_type, source_workout_exercise_id, workout_swap_fragment, position, rest_seconds, note, superset_group, log_effort, warmup_key, created_at FROM session_exercise WHERE user_id = auth.user_id() AND deleted_at IS NULL
      - SELECT id, user_id, session_id, media_id, position, created_at FROM session_photo WHERE user_id = auth.user_id() AND deleted_at IS NULL
      - SELECT id, user_id, session_exercise_id, position, kind, weight_kg, reps, duration_s, distance_m, floors, steps, rpe, completed_at, timer_started_at, target, generated_warmup, created_at FROM session_set WHERE user_id = auth.user_id() AND deleted_at IS NULL
      - SELECT id, user_id, kind, weight_kg, unit, label, count, enabled, created_at FROM gym_equipment WHERE user_id = auth.user_id() AND deleted_at IS NULL
      - SELECT id, user_id, exercise_id, bar_id, log_effort, progression_per_set, auto_warmups, note, created_at FROM exercise_setting WHERE user_id = auth.user_id() AND deleted_at IS NULL

  my_body:
    auto_subscribe: true
    queries:
      - SELECT id, user_id, metric, value, measured_at, local_date, source, created_at
        FROM body_measurement
        WHERE user_id = auth.user_id() AND deleted_at IS NULL
      - SELECT id, user_id, media_id, pose, taken_at, local_date, created_at
        FROM progress_photo
        WHERE user_id = auth.user_id() AND deleted_at IS NULL

  # A user's media rows (ADR 0040): what each image is. The bytes are not here: the device
  # fetches the objects through presigned URLs. Deleted media leave the stream, which is what
  # tells the other devices to drop their files. `deleted_at` and `objects_purged_at` stay on the server.
  my_media:
    auto_subscribe: true
    priority: 1
    query: SELECT id, user_id, kind, mime, width, height, bytes, thumb_bytes, created_at FROM media WHERE user_id = auth.user_id() AND deleted_at IS NULL

  # A user's preferences (ADR 0049): the one row per user, so units, language and the other
  # settings are readable on the device before anything else. Never deleted. `updated_at` stays on
  # the server.
  my_preferences:
    auto_subscribe: true
    priority: 1
    query: SELECT id, user_id, locale, timezone, ui, created_at FROM user_preferences WHERE user_id = auth.user_id()
