name: Android release

# Builds a signed release APK and attaches it to a GitHub Release.
# Push a tag like `v1.0.0` to publish, or run it by hand to get the APK as a workflow artifact.
# Needs: repository variable EXPO_PUBLIC_SERVER_URL (the deployed API), and secrets
# ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS,
# ANDROID_UPLOAD_KEY_PASSWORD. See docs/guides/android-release.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub Release
    env:
      EXPO_PUBLIC_SERVER_URL: ${{ vars.EXPO_PUBLIC_SERVER_URL }}
      EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.EXPO_PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency caches: a release must not consume a cache another workflow could poison.
          package-manager-cache: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Check configuration
        run: |
          if [ -z "$EXPO_PUBLIC_SERVER_URL" ]; then
            echo "::error::Set the EXPO_PUBLIC_SERVER_URL repository variable to the deployed API."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Generate the Android project
        working-directory: apps/native
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Decode the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_UPLOAD_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build the release APK
        working-directory: apps/native/android
        env:
          VERMILLION_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          VERMILLION_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          VERMILLION_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          VERMILLION_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          # One ABI keeps the APK small; nearly every current Android phone is arm64.
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: Name the APK
        id: apk
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          name="vermillion-${REF_NAME//\//-}.apk"
          mv apps/native/android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vermillion-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          gh release create "$REF_NAME" "$APK" --repo "$GITHUB_REPOSITORY" --title "Vermillion $REF_NAME" \
            --generate-notes
