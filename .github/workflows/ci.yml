name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-secret placeholders: CI has no .env files, so the env schemas read these.
    env:
      EXPO_PUBLIC_SERVER_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-for-production-0000
      DATABASE_URL: postgres://postgres:password@localhost:5432/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Dead code and unused dependencies
        run: pnpm knip
      - name: i18n consistency
        run: pnpm i18n:check
      - name: i18n keys match the code
        run: pnpm i18n:report
      - name: Typecheck
        run: pnpm typecheck

  # Tests clone a migrated template database on a real Postgres (ADR 0024). The repo's
  # compose file starts it with the logical-WAL flags the sync infrastructure tests need.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_SERVER_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-for-production-0000
      DATABASE_URL: postgres://postgres:password@localhost:5432/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Postgres
        run: docker compose up -d --wait postgres
      - name: Unit and API tests
        run: pnpm test
      - name: Sync infrastructure tests
        run: pnpm test:sync-infra
      - name: Postgres log
        if: failure()
        run: docker compose logs postgres

  # Seam 3 (ADR 0024): headless PowerSync clients against the real API, Postgres and
  # powersync-service, all from the repo's compose file. Order matters: the bootstrap creates
  # the publication, the server's migrations add `notes` to it, and only then may PowerSync
  # start with the `notes` stream (ADR 0023). PowerSync reaches the API's JWKS on the host.
  # The parity test runs in the `tests` job (`pnpm test`). The fault suites stop PowerSync and
  # cut database sessions, so they are enabled here by naming the compose container; locally
  # run the same steps against a throwaway stack (see .agents/sync.md).
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: development
      EXPO_PUBLIC_SERVER_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-for-production-0000
      DATABASE_URL: postgresql://postgres:password@localhost:5432/vermillion
      EMAIL_CONSOLE: "true"
      SYNC_TEST_POWERSYNC_CONTAINER: vermillion-powersync-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Postgres and run the replication bootstrap
        run: |
          pnpm --filter server build:bootstrap
          docker compose up -d --wait postgres
          docker compose up --no-deps powersync-bootstrap
      - name: Start the API (migrates, serves the JWKS)
        run: |
          nohup pnpm --filter server exec tsx src/index.ts > server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fs http://127.0.0.1:3000/api/health && exit 0
            sleep 2
          done
          cat server.log
          exit 1
      - name: Start PowerSync
        run: docker compose up -d --wait powersync
      - name: Sync tests
        run: pnpm test:sync
      - name: Logs
        if: failure()
        run: |
          cat server.log
          docker compose logs powersync postgres

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
