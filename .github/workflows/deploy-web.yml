name: Deploy site

# Builds the site (apps/web: prerendered public pages, the admin's client-only shell and the
# Worker that forwards /rpc and /api) and deploys it to Cloudflare Workers with wrangler, on the
# custom domain in apps/web/wrangler.jsonc.
#
# Like deploy-server.yml, the CI jobs run inside this workflow (ci.yml through `workflow_call`)
# and the deploy needs them, so nothing ships from a commit whose checks or tests fail.
#
# Needs, in the `production` environment:
#   secret    CLOUDFLARE_API_TOKEN      a token with "Workers Scripts: Edit" (and Workers Routes
#                                       for the custom domain) on the account
#   secret    CLOUDFLARE_ACCOUNT_ID     the Cloudflare account id
#   variable  VITE_TURNSTILE_SITE_KEY   optional: the request-access form's Turnstile site key
on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/**
      # Used only by the native app and the server.
      - "!packages/sync/**"
      - "!packages/db/**"
      - "!packages/email/**"
      - "!packages/logger/**"
      - app.config.ts
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    name: CI
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
    uses: $/.github/workflows/ci.yml

  deploy:
    name: Build and deploy the site
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - name: Check the configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          failed=0
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error title=Missing secret::CLOUDFLARE_API_TOKEN is not set in the production environment."; failed=1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error title=Missing secret::CLOUDFLARE_ACCOUNT_ID is not set in the production environment."; failed=1; }
          exit "$failed"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter web build
      - name: Deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: pnpm exec wrangler deploy --message "$COMMIT_SHA"
