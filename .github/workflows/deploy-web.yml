name: Deploy web

# Builds apps/web (TanStack Start, prerendered) and deploys it to Cloudflare Workers with Wrangler
# (ADR 0052). The custom domain is the route in apps/web/wrangler.jsonc; `check:host` fails the
# job when it no longer matches `appConfig.publicSite.url`.
#
# Secrets, in the `production` environment or at repository level:
#   CLOUDFLARE_API_TOKEN   an API token with Workers Scripts: Edit and the zone's Workers Routes
#                          (custom domains) permission; see docs/deployment.md, "Website"
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/config/**
      - app.config.ts
      - package.json
      - .npmrc
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

# Finish the running deploy. If pushes pile up, keep the newest pending run.
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Build and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add required reviewers to this environment to make every deploy wait for an approval.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Custom domain matches app.config.ts
        run: pnpm --filter web check:host
      - name: Typecheck
        run: pnpm --filter web typecheck
      - name: Build
        run: pnpm --filter web build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Deploys what the build wrote: Wrangler follows `.wrangler/deploy/config.json` to the
        # generated config in dist/server. Passing --config would bypass it.
        run: |
          missing=()
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=(CLOUDFLARE_API_TOKEN)
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          if (( ${#missing[@]} )); then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}. Set them in the production environment or repository settings."
            exit 1
          fi
          pnpm --filter web exec wrangler deploy
